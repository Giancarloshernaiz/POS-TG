<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'none';"
    />
    <title>POS-TG</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b1220;
        color: #e2e8f0;
        font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
        overflow: hidden;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        user-select: none;
      }
      .brand {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .sub {
        font-size: 14px;
        opacity: 0.75;
      }
      #phase {
        font-size: 13px;
        opacity: 0.9;
        min-height: 18px;
      }
      .bar {
        width: 320px;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 2px;
        overflow: hidden;
      }
      .fill {
        width: 30%;
        height: 100%;
        background: linear-gradient(90deg, #6366f1, #06b6d4);
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(400%);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">POS-TG</div>
      <div class="sub">Iniciando sistema…</div>
      <div class="bar"><div class="fill"></div></div>
      <div id="phase"></div>
    </div>
  </body>
</html>
